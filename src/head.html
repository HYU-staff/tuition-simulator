<title>등록금·정원 재정 시뮬레이터</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 좌측 가정 패널 + 우측 결과(대시보드→시나리오→민감도→가이드) 2열, 좁은 화면에서 1열 */
:root{
  --bg:#f5f6f4; --panel:#ffffff; --ink:#1d2730; --muted:#5d6b75; --line:#d9dfdd;
  --accent:#1f6f6b; --accent-soft:#e1efed; --good:#2c7a3f; --good-soft:#e3f1e5;
  --warn:#9a6a00; --warn-soft:#fbf1d9; --bad:#b0362c; --bad-soft:#f8e2df; --hl:#fff6d6;
  --f-body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-num:"IBM Plex Mono","Consolas",monospace;
  --page:min(100%,1920px); --side:clamp(300px,21vw,400px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a1e; --panel:#1c242a; --ink:#e4ebee; --muted:#9aa8b1; --line:#2f3a41;
  --accent:#5cbfb7; --accent-soft:#1f3634; --good:#6fcf86; --good-soft:#1d3324;
  --warn:#e5b84d; --warn-soft:#3a3018; --bad:#ef8a7f; --bad-soft:#3d2320; --hl:#33301c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1e; --panel:#1c242a; --ink:#e4ebee; --muted:#9aa8b1; --line:#2f3a41;
  --accent:#5cbfb7; --accent-soft:#1f3634; --good:#6fcf86; --good-soft:#1d3324;
  --warn:#e5b84d; --warn-soft:#3a3018; --bad:#ef8a7f; --bad-soft:#3d2320; --hl:#33301c; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.tabsTop{max-width:var(--page);margin:0 auto 14px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.navtab{font-family:var(--f-body);font-size:14px;font-weight:600;padding:8px 16px;border:1px solid transparent;border-bottom:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px 6px 0 0}
.navtab[aria-selected=true]{background:var(--panel);color:var(--accent);border-color:var(--line);margin-bottom:-1px}
.h3{font-size:14px;margin:16px 0 6px}
.hdrR{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:flex-end}
.fb{color:var(--muted);text-decoration:underline dotted}
.btn.sm{padding:4px 10px;font-size:12.5px;margin-top:6px}
td input,td select{width:auto;min-width:64px;max-width:100%}
td input.txt{min-width:140px;text-align:left;font-family:var(--f-body)}
td select.wide{min-width:280px}
button.x{font-size:12px;border:1px solid var(--line);background:transparent;color:var(--bad);border-radius:5px;padding:2px 8px;cursor:pointer}
label.chk{display:flex;gap:6px;align-items:flex-start;font-size:12.5px}
.qIn{width:84px}
.rate2{font-family:var(--f-num);font-size:15px}
.rate2 b{font-size:20px;font-weight:500}
label.chk{flex-wrap:nowrap}
label.f:has(select){grid-template-columns:1fr 132px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:clamp(14px,0.42vw + 8.4px,16px);line-height:1.55;padding-inline:clamp(16px,2vw,40px);padding-block:20px 40px}
.wrap{max-width:var(--page);margin:0 auto;display:grid;grid-template-columns:var(--side) minmax(0,1fr);gap:clamp(16px,1.4vw,28px);align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
header.top{max-width:var(--page);margin:0 auto 16px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
h1{font-size:22px;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
aside.panel{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:900px){aside.panel{position:static;max-height:none}}
.grp{display:grid;gap:8px;padding-block:12px;border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:0}
.grp h3{margin:0;font-size:12px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
label.f{display:grid;grid-template-columns:1fr clamp(92px,5.5vw,120px);gap:8px;align-items:center;font-size:0.93em}
label.f small{display:block;color:var(--muted);font-size:11px;line-height:1.35}
input[type=number],select{width:100%;font-family:var(--f-num);font-size:13px;padding:5px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);text-align:right}
select{text-align:left;font-family:var(--f-body)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chk{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px}
.capbox{background:var(--accent-soft);border-radius:6px;padding:8px 10px;font-size:13px}
.capbox b{font-family:var(--f-num);font-size:16px}
main{display:grid;gap:20px;min-width:0;grid-template-columns:minmax(0,1fr)}
main>section{min-width:0}
section.panel h2{margin:0 0 4px;font-size:16px}
section.panel .lead{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.kpi .k{font-size:11.5px;color:var(--muted)}
.kpi .v{font-family:var(--f-num);font-size:18px;font-weight:500}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:0.93em;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;background:var(--bg)}
th:first-child,td:first-child{text-align:left}
td{text-align:right;font-family:var(--f-num)}
td.t{font-family:var(--f-body);text-align:center}
tr.sA td{background:var(--good-soft)} tr.sB td{background:var(--hl)} tr.sC td{background:var(--warn-soft)}
tr.over td{color:var(--muted)}
.neg{color:var(--bad)} .pos{color:var(--good)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-family:var(--f-body);font-weight:600}
.p-ok{background:var(--good-soft);color:var(--good)} .p-no{background:var(--bad-soft);color:var(--bad)}
.p-D{background:var(--accent-soft);color:var(--accent)} tr.sD td{background:var(--accent-soft)}
.card.user{border:2px dashed var(--accent)}
.prop{margin:0;font-size:13px;padding:8px 10px;border-radius:6px;background:var(--accent-soft)}
.dIn{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.dIn label{display:inline-flex;gap:6px;align-items:center;font-weight:600;font-size:13px}
.dIn input{width:96px}
.p-A{background:var(--good-soft);color:var(--good)} .p-B{background:var(--hl);color:var(--warn)} .p-C{background:var(--warn-soft);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:8px;align-content:start}
.card.rec{border:2px solid var(--accent)}
.card h4{margin:0;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .rate{font-family:var(--f-num);font-size:26px;font-weight:500}
.card dl{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin:0;font-size:12.5px}
.card dt{color:var(--muted)} .card dd{margin:0;font-family:var(--f-num);text-align:right}
.card ul{margin:0;padding-left:18px;font-size:12.5px;display:grid;gap:3px}
.risk{display:flex;gap:3px;align-items:center;font-size:12px;color:var(--muted)}
.risk i{width:14px;height:8px;border-radius:2px;background:var(--line)}
.risk i.on{background:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{font-family:var(--f-body);font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.mx td{text-align:center;font-weight:500}
.mx th{text-align:center}
.guide{display:grid;gap:10px}
.guide p{margin:0;max-width:78ch}
.guide ol{margin:0;padding-left:20px;display:grid;gap:6px;max-width:82ch}
.note{font-size:12px;color:var(--muted);max-width:90ch}
svg text{fill:var(--muted);font-family:var(--f-num);font-size:11px}
.foot{max-width:var(--page);margin:20px auto 0;font-size:12px;color:var(--muted)}
.foot a{color:var(--accent)}
.up{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-body);font-size:13px;font-weight:600;padding:7px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--panel);cursor:pointer}
.btn input{position:absolute;width:1px;height:1px;opacity:0}
.btn.ghost{background:transparent;color:var(--accent)}
.f2{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.f2 select{width:auto}
.status{font-size:13px;padding:8px 10px;border-radius:6px;background:var(--accent-soft);margin-bottom:10px}
.status.err{background:var(--bad-soft);color:var(--bad)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
</style>
